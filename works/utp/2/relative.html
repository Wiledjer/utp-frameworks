<!DOCTYPE html>
<head>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        section { border: 1px solid #ccc; margin: 20px; padding: 15px; }
        .relative-container {
            position: relative;
            height: 200px;
            background: #f0f0f0;
            margin: 30px 0;
            border: 1px dashed #888;
        }
        .static-box {
            width: 100px;
            height: 100px;
            background: #a0a0a0;
            text-align: center;
            line-height: 100px;
            border: 1px solid #555;
            float: left;
            margin-right: 30px;
        }
        .relative-box {
            position: relative;
            top: 25px;
            left: 25px;
            width: 100px;
            height: 100px;
            background: #c0c0c0;
            text-align: center;
            line-height: 100px;
            border: 1px solid #555;
            float: left;
        }
        .ghost {
            width: 100px;
            height: 100px;
            border: 1px dashed #ff6666;
            float: left;
            margin-left: -160px;
            background: transparent;
            text-align: center;
            line-height: 100px;
            color: black;
            font-size: 10px;
        }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #008CBA; color: white; text-decoration: none; border-radius: 4px; }
        .back-btn:hover { background-color: #005f6b; }
        hr { margin: 20px 0; }
    </style>

  <style id="portfolio-return-link-style">
    .portfolio-return-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #111827;
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .portfolio-return-link:hover {
      transform: translateY(-1px);
      background: #ffffff;
      color: #111827;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.2);
    }

    .portfolio-return-link:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .portfolio-return-link {
        top: 10px;
        left: 10px;
        padding: 9px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <a class="portfolio-return-link" href="../../../labs/index.html" aria-label="Вернуться к списку всех лабораторных работ">← К лабораторным</a>

    <h1>Relative позиционирование</h1>
    <section>
        <div class="relative-container">
            <div class="static-box">static</div>

            <div class="relative-box">relative<br>top:25 left:25</div>

            <div class="ghost">исходное</div>
        </div>
        <p><strong>Объяснение:</strong> Серый блок (static) стоит на месте. Светло-серый (relative) сдвинут на 25px вниз и вправо <strong>относительно своего исходного положения</strong></p>
    </section>
    <a href="index.html" class="back-btn">Назад на главную</a>
</body>
</html>
