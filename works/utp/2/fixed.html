<!DOCTYPE html>
<head>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        section { border: 1px solid #ccc; margin: 20px; padding: 15px; }
        .fixed-box {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 80px;
            height: 80px;
            background: #ffdddd;
            border: 2px solid #333;
            text-align: center;
            line-height: 80px;
            font-weight: bold;
        }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #008CBA; color: white; text-decoration: none; border-radius: 4px; }
        .back-btn:hover { background-color: #005f6b; }
    </style>

  <style id="portfolio-return-link-style">
    .portfolio-return-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #111827;
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .portfolio-return-link:hover {
      transform: translateY(-1px);
      background: #ffffff;
      color: #111827;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.2);
    }

    .portfolio-return-link:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .portfolio-return-link {
        top: 10px;
        left: 10px;
        padding: 9px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <a class="portfolio-return-link" href="../../../labs/index.html" aria-label="Вернуться к списку всех лабораторных работ">← К лабораторным</a>

    <h1>Fixed позиционирование</h1>
    <section>
        <h2>Фиксированный блок</h2>
        <p>Серый квадрат в правом нижнем углу окна зафиксирован при прокрутке.</p>
        <p>Прокрутите страницу, чтобы увидеть, что блок остаётся на месте.</p>
        <div style="height: 1000px; background: linear-gradient(white, lightgray);">
            (Зона для прокрутки)
        </div>
    </section>
    <div class="fixed-box">Fixed</div>
    <a href="index.html" class="back-btn">Назад на главную</a>
</body>
</html>
