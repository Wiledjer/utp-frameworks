<!DOCTYPE html>
<head>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
        }
        .methods-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .method-table {
            width: 250px;
            border: 2px solid #333;
            border-collapse: collapse;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .method-table th {
            background-color: blue;
            color: white;
            padding: 12px;
            font-size: 1.2em;
        }
        .method-table td {
            padding: 20px;
            text-align: center;
        }
        .method-table button {
            background-color: #008CBA;
            border: none;
            color: white;
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .method-table button:hover {
            background-color: #005f6b;
        }
    </style>

  <style id="portfolio-return-link-style">
    .portfolio-return-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #111827;
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .portfolio-return-link:hover {
      transform: translateY(-1px);
      background: #ffffff;
      color: #111827;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.2);
    }

    .portfolio-return-link:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .portfolio-return-link {
        top: 10px;
        left: 10px;
        padding: 9px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <a class="portfolio-return-link" href="../../../labs/index.html" aria-label="Вернуться к списку всех лабораторных работ">← К лабораторным</a>

    <h1>Способы расположения элементов</h1>
    <div class="methods-container">
        <table class="method-table">
            <tr><th>Таблицы</th></tr>
            <tr><td><button onclick="location.href='table.html'">Открыть файл</button></td></tr>
        </table>
        <table class="method-table">
            <tr><th>Float</th></tr>
            <tr><td><button onclick="location.href='float.html'">Открыть файл</button></td></tr>
        </table>
        <table class="method-table">
            <tr><th>Relative</th></tr>
            <tr><td><button onclick="location.href='relative.html'">Открыть файл</button></td></tr>
        </table>
        <table class="method-table">
            <tr><th>Absolute</th></tr>
            <tr><td><button onclick="location.href='absolute.html'">Открыть файл</button></td></tr>
        </table>
        <table class="method-table">
            <tr><th>Fixed</th></tr>
            <tr><td><button onclick="location.href='fixed.html'">Открыть файл</button></td></tr>
        </table>
        <table class="method-table">
            <tr><th>Flexbox</th></tr>
            <tr><td><button onclick="location.href='flexbox.html'">Открыть файл</button></td></tr>
        </table>
    </div>
</body>
</html>
