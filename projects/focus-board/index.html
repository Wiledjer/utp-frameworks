<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FocusBoard — минималистичная панель задач с фильтрами, статусами и сохранением в localStorage."
    />
    <title>FocusBoard · Главный проект</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="back-link" href="../../">← Портфолио</a>
      <button class="theme-button" type="button" data-theme-toggle>Тёмная тема</button>
    </header>

    <main class="app-shell">
      <section class="hero-panel">
        <div>
          <p class="eyebrow">FocusBoard</p>
          <h1>Панель задач без лишнего шума</h1>
          <p>
            Добавляй задачи, меняй статусы, фильтруй список и сохраняй прогресс прямо в
            браузере. Проект сделан на чистом HTML, CSS и JavaScript.
          </p>
        </div>
        <div class="progress-card" aria-label="Статистика задач">
          <span class="progress-card__label">Progress</span>
          <strong data-progress-value>0%</strong>
          <span data-progress-caption>Нет завершённых задач</span>
        </div>
      </section>

      <section class="stats" aria-label="Сводка задач">
        <article class="stat-card">
          <span>Всего</span>
          <strong data-total-count>0</strong>
        </article>
        <article class="stat-card">
          <span>В работе</span>
          <strong data-active-count>0</strong>
        </article>
        <article class="stat-card">
          <span>Готово</span>
          <strong data-done-count>0</strong>
        </article>
      </section>

      <section class="board-layout">
        <aside class="panel add-panel">
          <div class="panel-heading">
            <p class="eyebrow">Новая задача</p>
            <h2>Добавить</h2>
          </div>

          <form class="task-form" data-task-form>
            <label>
              Название
              <input
                type="text"
                name="title"
                placeholder="Например: сверстать секцию hero"
                minlength="2"
                required
              />
            </label>

            <label>
              Описание
              <textarea
                name="description"
                rows="4"
                placeholder="Коротко опиши, что нужно сделать"
              ></textarea>
            </label>

            <label>
              Статус
              <select name="status">
                <option value="todo">Todo</option>
                <option value="progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </label>

            <button class="primary-button" type="submit">Добавить задачу</button>
          </form>
        </aside>

        <section class="panel tasks-panel">
          <div class="panel-heading panel-heading--row">
            <div>
              <p class="eyebrow">Список</p>
              <h2>Задачи</h2>
            </div>
            <div class="filters" aria-label="Фильтр задач">
              <button class="filter-button is-active" type="button" data-filter="all">Все</button>
              <button class="filter-button" type="button" data-filter="todo">Todo</button>
              <button class="filter-button" type="button" data-filter="progress">В работе</button>
              <button class="filter-button" type="button" data-filter="done">Готово</button>
            </div>
          </div>

          <div class="tasks-list" data-tasks-list aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>
